# @package _global_
# Combined BBBC047 + DTI pActivity task config for continual pre-training.
#
# - bbbc047: 672-dim CPCNN cell-painting embeddings (graph-level regression).
# - dti_pactivity: scalar pActivity (pY) prediction conditioned on a 1152-dim
#   ESMC protein embedding via the task head's auxiliary input
#   (aux_in_dim=1152, aux_label_split=1).
#
# Both tasks are graph-level, so the model only instantiates
# graph_output_nn['graph']; the LargeMix checkpoint's node-level output is
# silently skipped during backbone loading.

datamodule:
  args:
    task_specific_args:
      bbbc047:
        df_path: /home/shpark/prj-molrepr/data/bbbc047/bbbc047_smiles_embeddings.csv
        smiles_col: "SMILES"
        label_cols: feature_*
        split_val: 0.1
        split_test: 0.1
        seed: 0
        task_level: graph
        label_normalization:
          normalize_val_test: True
          method: "normal"
      dti_pactivity:
        df_path: data/dti-processed/dti_pactivity_esmc_100k.csv
        smiles_col: "SMILES_nometa"
        label_cols: ["pY", "prot_emb_*"]   # explicit so adding pY_bin to the CSV doesn't shift aux dim
        split_val: 0.1
        split_test: 0.1
        seed: 0
        task_level: graph

architecture:
  task_heads:
    bbbc047:
      task_level: graph
      out_dim: 672
      hidden_dims: 128
      depth: 2
      activation: relu
      last_activation: none
      dropout: ${architecture.pre_nn.dropout}
      normalization: ${architecture.pre_nn.normalization}
      last_normalization: "none"
      residual_type: none
    dti_pactivity:
      task_level: graph
      out_dim: 1
      hidden_dims: 256
      depth: 2
      activation: relu
      last_activation: none
      dropout: ${architecture.pre_nn.dropout}
      normalization: ${architecture.pre_nn.normalization}
      last_normalization: "none"
      residual_type: none
      aux_in_dim: 1152       # ESMC protein embedding dimension
      aux_label_split: 1     # first 1 column is the real label (pY)

predictor:
  aux_label_splits:
    dti_pactivity: 1          # must match aux_label_split above
  loss_fun:
    bbbc047: mae_ipu
    dti_pactivity: mae_ipu
  metrics_on_progress_bar:
    bbbc047: ['mae']
    dti_pactivity: ['mae']
  metrics_on_training_set:
    bbbc047: ['mae']
    dti_pactivity: ['mae']

metrics:
  bbbc047:
  - name: mae
    metric: mae_ipu
  - name: pearsonr
    metric: pearsonr_ipu
  dti_pactivity:
  - name: mae
    metric: mae_ipu
  - name: pearsonr
    metric: pearsonr_ipu
