# @package _global_

# BELKA uses AUPRC as the primary metric (class imbalance ≈ 0.5–1% positives).
# Loss: BCE-with-logits; predictions are sigmoid'd in the task head.

predictor:
  metrics_on_progress_bar:
    belka_brd4: ["auprc"]
    belka_hsa:  ["auprc"]
    belka_seh:  ["auprc"]
  loss_fun:
    belka_brd4: bce_logits
    belka_hsa:  bce_logits
    belka_seh:  bce_logits
  random_seed: ${constants.seed}
  optim_kwargs:
    lr: 1.e-4
  torch_scheduler_kwargs:
    module_type: CosineAnnealingLR
    T_max: ${constants.max_epochs}
    eta_min: 1.0e-6
  target_nan_mask: null
  multitask_handling: flatten

metrics:
  belka_brd4: &belka_metrics
    - name: auprc
      metric: averageprecision
      task: binary
      multitask_handling: mean-per-label
      threshold_kwargs: null
    - name: auroc
      metric: auroc
      task: binary
      multitask_handling: mean-per-label
      threshold_kwargs: null
    - name: accuracy
      metric: accuracy
      multitask_handling: mean-per-label
      target_to_int: True
      average: micro
      threshold_kwargs: &threshold_05
        operator: greater
        threshold: 0.5
        th_on_preds: True
        th_on_target: True
    - name: mcc
      metric: mcc
      num_classes: 2
      multitask_handling: mean-per-label
      target_to_int: True
      average: micro
      threshold_kwargs: *threshold_05
  belka_hsa: *belka_metrics
  belka_seh: *belka_metrics

datamodule:
  module_type: "BelkaBenchmarkDataModule"
  args:
    belka_targets: null            # null => all three
    subsample_size: 200000
    split_kind: random             # 'random' | 'scaffold' | 'kaggle_ood'
    subsample_seed: ${constants.seed}
    val_fraction: 0.1
    test_fraction: 0.1
    belka_cache_dir: /home/shpark/prj-molrepr/datacache/belka
    processed_graph_data_path: null

constants:
  raise_train_error: false

trainer:
  model_checkpoint:
    save_last: false
