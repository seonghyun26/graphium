# @package _global_
#
# ADMET fine-tuning from a pure DTI-pActivity pretrained model (no ToyMix).
# Unlike toymix_dti_pactivity (which reuses the zinc head), this pretrain only
# has the dti_pactivity head (aux_in_dim=1152). We drop both head layers and
# zero out aux_in_dim via module_overrides so the rebuilt head takes only
# graph features (in_dim=512).

defaults:
  - override /tasks/loss_metrics_datamodule: admet

constants:
  task: lipophilicity_astrazeneca
  name: finetuning_${constants.task}_dti_pactivity
  wandb:
    name: ${constants.name}
    project: ${constants.task}
    entity: multitask-gnn
  seed: 42
  max_epochs: 100
  data_dir: expts/data/admet/${constants.task}
  raise_train_error: false
  datacache_path: /home/shpark/prj-molrepr/datacache/admet/${constants.task}

predictor:
  optim_kwargs:
    lr: 1.e-4
  torch_scheduler_kwargs:
    module_type: CosineAnnealingLR
    T_max: ${constants.max_epochs}
    eta_min: 1.0e-6

datamodule:
  args:
    num_workers: 0
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    save_last: false

finetuning:
  task: ${constants.task}
  level: graph
  pretrained_model: dummy-pretrained-model
  finetuning_module: task_heads
  sub_module_from_pretrained: dti_pactivity
  new_sub_module: ${constants.task}
  drop_depth: 2
  new_out_dim: 8
  added_depth: 2
  unfreeze_pretrained_depth: 0
  epoch_unfreeze_all: 50
  module_overrides:
    aux_in_dim: 0
    aux_label_split: 0
  finetuning_head:
    task: ${constants.task}
    previous_module: task_heads
    incoming_level: graph
    model_type: mlp
    in_dim: 8
    out_dim: 1
    hidden_dims: 8
    depth: 2
    last_layer_is_readout: true
