# @package _global_
#
# ADMET fine-tuning from a ToyMix+DTI+pActivity-pretrained model.
# Uses dti_pactivity task head as the sub_module_from_pretrained.

defaults:
  - override /tasks/loss_metrics_datamodule: admet

constants:
  task: lipophilicity_astrazeneca
  name: finetuning_${constants.task}_toymix_dti_pactivity
  wandb:
    name: ${constants.name}
    project: ${constants.task}
    entity: multitask-gnn
  seed: 42
  max_epochs: 100
  data_dir: expts/data/admet/${constants.task}
  raise_train_error: false
  datacache_path: /home/shpark/prj-molrepr/datacache/admet/${constants.task}

predictor:
  optim_kwargs:
    lr: 1.e-4
  torch_scheduler_kwargs:
    module_type: CosineAnnealingLR
    T_max: ${constants.max_epochs}
    eta_min: 1.0e-6

datamodule:
  args:
    num_workers: 0
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    save_last: false

finetuning:
  task: ${constants.task}
  level: graph
  pretrained_model: dummy-pretrained-model
  finetuning_module: task_heads
  # Use zinc head (in_dim=512, matching graph_output_nn.out_dim) instead of
  # dti_pactivity (in_dim=1664, pair+graph concatenation) to avoid shape mismatch.
  sub_module_from_pretrained: zinc
  new_sub_module: ${constants.task}
  drop_depth: 1
  new_out_dim: 8
  added_depth: 2
  unfreeze_pretrained_depth: 0
  epoch_unfreeze_all: 50
  finetuning_head:
    task: ${constants.task}
    previous_module: task_heads
    incoming_level: graph
    model_type: mlp
    in_dim: 8
    out_dim: 1
    hidden_dims: 8
    depth: 2
    last_layer_is_readout: true
