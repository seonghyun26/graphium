# @package _global_

# Fine-tuning appendum for the 29-assay cell_bioactivity benchmark
# (Fredinh et al., Nat. Commun. 2024). Swaps a toymix/zinc task head for a fresh
# `cell_bioactivity` multi-output binary head.

defaults:
  - override /tasks: cell_bioactivity

constants:
  task: cell_bioactivity
  name: finetuning_cell_bioactivity_toymix
  wandb:
    name: ${constants.name}
    project: cell_bioactivity
    entity: multitask-gnn
  seed: 42
  max_epochs: 50
  raise_train_error: false
  datacache_path: /home/shpark/prj-molrepr/datacache/cell_bioactivity

predictor:
  optim_kwargs:
    lr: 1.e-4
  torch_scheduler_kwargs:
    module_type: CosineAnnealingLR
    T_max: ${constants.max_epochs}
    eta_min: 1.0e-6

datamodule:
  args:
    num_workers: 0
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    save_last: false

finetuning:
  task: cell_bioactivity
  level: graph

  pretrained_model: dummy-pretrained-model
  finetuning_module: task_heads
  sub_module_from_pretrained: zinc
  new_sub_module: cell_bioactivity

  drop_depth: 1
  new_out_dim: 256
  added_depth: 2

  unfreeze_pretrained_depth: 0
  epoch_unfreeze_all: 25

  finetuning_head:
    task: cell_bioactivity
    previous_module: task_heads
    incoming_level: graph
    model_type: mlp
    in_dim: 256
    out_dim: 29
    hidden_dims: 256
    depth: 2
    last_layer_is_readout: true
    # bce_logits loss expects raw logits; keep the finetuning head linear at the end.
    last_activation: none
