# @package _global_

# Fine-tuning appendum for the Polaris biogen/adme-fang-v1 benchmark suite.
# Mirrors `finetuning/admet.yaml` (TDC ADMET) but points at the Polaris datamodule
# and uses `zinc` as the sub-module carried over from toymix pretraining.

defaults:
  - override /tasks/loss_metrics_datamodule: polaris_admet

constants:
  task: adme_fang_hclint
  name: finetuning_${constants.task}_toymix
  wandb:
    name: ${constants.name}
    project: ${constants.task}
    entity: multitask-gnn
  seed: 42
  max_epochs: 100
  raise_train_error: false
  datacache_path: /home/shpark/prj-molrepr/datacache/polaris_adme_fang/${constants.task}

predictor:
  optim_kwargs:
    lr: 1.e-4
  torch_scheduler_kwargs:
    module_type: CosineAnnealingLR
    T_max: ${constants.max_epochs}
    eta_min: 1.0e-6

datamodule:
  args:
    num_workers: 0
    featurization_n_jobs: 0
    polaris_benchmark_names: ${constants.task}

trainer:
  model_checkpoint:
    save_last: false

finetuning:

  task: ${constants.task}
  level: graph

  pretrained_model: dummy-pretrained-model
  finetuning_module: task_heads
  sub_module_from_pretrained: zinc
  new_sub_module: ${constants.task}

  drop_depth: 1
  new_out_dim: 8
  added_depth: 2

  unfreeze_pretrained_depth: 0
  epoch_unfreeze_all: 50

  finetuning_head:
    task: ${constants.task}
    previous_module: task_heads
    incoming_level: graph
    model_type: mlp
    in_dim: 8
    out_dim: 1
    hidden_dims: 8
    depth: 2
    last_layer_is_readout: true
