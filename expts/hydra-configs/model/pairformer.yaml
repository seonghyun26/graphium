# @package _global_
# Pairformer model configuration
# Adapted from the Boltz biomolecular interaction model (https://github.com/jwohlwend/boltz)
#
# The Pairformer maintains two representation tracks:
#   - A single (node/sequence) track  s  of shape (B, N, D_s)
#   - A pairwise track  z  of shape (B, N, N, D_z)
# If pair_feat is not already present in the batch the layer
# initialises z via an outer-product-mean of node features.

architecture:
  gnn:
    depth: 16
    layer_type: 'pyg:pairformer'
    layer_kwargs:
      pair_dim: 64               # Pairwise representation dimension (D_z)
      num_heads: 8               # Attention heads for single-track attention
      pairwise_head_width: 32    # Per-head hidden dim for triangle attention
      pairwise_num_heads: 4      # Number of heads for triangle attention
      pair_dropout: 0.25         # Row/column-wise dropout on the pair track
      hidden_dim_scaling: 4.0    # Multiplier for transition MLP hidden dim
      opm_hidden: 32             # Hidden dim of the outer-product-mean layer
      use_checkpoint: true       # Gradient checkpointing for pair-track ops (saves ~16x activation memory)