# @package _global_
# PairMixer ~12M configuration
#
# D_s=128, D_z=256, depth=6 → ~12M params
#   pair-track backbone: 6 layers * 24 * D_z^2 ≈ 9.4M
#   extras (pre_nn, pre_nn_edges, OPM, graph_output_nn, task heads) ≈ 2-3M
#
# Trades depth for a wider pair representation vs pairmixer_10M (D_z=128, depth=18).
# Node track stays narrow (D_s=128) since PairMixer's capacity lives in the pair track.
# Reference: Ouyang-Zhang et al., arXiv:2510.18870

architecture:
  pre_nn:
    out_dim: 128
    hidden_dims: 128

  pre_nn_edges:
    out_dim: 12                  # Minimal edge embedding; pair init projects to pair_dim
    hidden_dims: 12
    depth: 2
    activation: relu
    last_activation: none
    dropout: 0.02
    normalization: layer_norm
    last_normalization: layer_norm
    residual_type: none

  gnn:
    in_dim: 128
    out_dim: 128
    hidden_dims: 128
    in_dim_edges: 12             # Must match pre_nn_edges.out_dim
    depth: 16
    residual_type: none           # PairMixer doesn't update node features (s_backbone=s_init);
                                  # simple residual would double them every layer → bf16 overflow.
    virtual_node: logsum          # Learnable global node (MiniMol-style); aids graph-level readout
    layer_type: 'pyg:pairmixer'
    layer_kwargs:
      pair_dim: 192              # Wider pair representation (matches 20M) at moderate depth
      pair_dropout: 0.25
      hidden_dim_scaling: 4.0
      opm_hidden: 32
      # ---- Speed ----
      # compile=pair_track + ckpt=false → ~2.6x fwd+bwd at depth=18.
      # Set ckpt=true if OOM at your training batch size.
      use_checkpoint: false
      compile_mode: pair_track

  graph_output_nn:
    graph:
      pair_dim: 192              # Pool pair_feat directly
      pair_pool: stats           # graph-aware stats pooling (level_in_dim = 6*pair_dim)
      node_pooling: [max]        # Also max-pool node embeddings; concat with pair-stats
      hidden_dims: 256
      out_dim: 512
