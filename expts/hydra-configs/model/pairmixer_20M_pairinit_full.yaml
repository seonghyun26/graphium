# @package _global_
# PairMixer 20M + full pair initialization stack (ablation arm).
#
# Combines every available pair-init source: graph distance, adjacency,
# 1-hop edge features, AND Graphormer-style path-summary edges.
#
#   z_0 = z_OPM + PE(graph_distance) + PE(adjacency)
#             + PE(edge_feat_1hop) + PE(path_edge)
#
# Tests whether the sources complement each other, or whether
# ``path_edge`` already subsumes ``edge_feat`` (since the first step of
# the path walk is the direct bond itself).

defaults:
  - pairmixer_20M

architecture:
  gnn:
    layer_kwargs:
      in_dim_edges: 13
      pair_init:
        mode: additive
        use_opm: true
        opm_init: lecun
        use_pair_positional: true
        pair_positional:
          sources: [graph_distance, adjacency, edge_feat, path_edge]
          graph_distance:
            max_dist: 8
            embedding_dim: 32
          adjacency:
            embedding_dim: 8
          edge_feat:
            embedding_dim: 16
          path_edge:
            embedding_dim: 16
            max_path_length: 5
