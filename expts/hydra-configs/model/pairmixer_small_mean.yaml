# @package _global_
# PairMixer small with legacy masked-mean pair pooling (pilot comparison variant).
#
# Identical to pairmixer_small.yaml except pair_pool="mean" instead of "stats".
# Used to A/B test graph-aware stats pooling vs simple masked-mean pooling.
#
# Note: hidden_dims / out_dim are kept identical to pairmixer_small.yaml so the
# head capacity is comparable across pooling modes. The first linear layer in
# graph_output_nn becomes a narrowing 64 -> 192 projection (instead of 384 -> 192
# under stats pooling) — this is intentional.

architecture:
  pre_nn:
    out_dim: 192
    hidden_dims: 192

  gnn:
    in_dim: 192
    out_dim: 192
    hidden_dims: 192
    depth: 8
    layer_type: 'pyg:pairmixer'
    layer_kwargs:
      pair_dim: 64
      pair_dropout: 0.25
      hidden_dim_scaling: 4.0
      opm_hidden: 32
      use_checkpoint: true

  graph_output_nn:
    graph:
      pair_dim: 64
      pair_pool: mean            # legacy masked-mean pooling (level_in_dim = pair_dim)
      hidden_dims: 192
      out_dim: 256
