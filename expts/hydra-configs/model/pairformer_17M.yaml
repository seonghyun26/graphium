# @package _global_
# Pairformer Medium (~17M parameters)
# Balanced config — comparable parameter count to a small GPS++ model.

defaults:
  - pairformer

architecture:
  pre_nn:
    out_dim: 256
    hidden_dims: 256

  gnn:
    in_dim: 256
    out_dim: 256
    hidden_dims: 256
    depth: 12
    layer_kwargs:
      pair_dim: 64
      num_heads: 4               # 256/4 = 64 head dim
      pairwise_head_width: 32
      pairwise_num_heads: 4
      pair_dropout: 0.25
      hidden_dim_scaling: 4.0
      opm_hidden: 32
      use_checkpoint: true

  graph_output_nn:
    graph:
      hidden_dims: 256
      out_dim: 512
