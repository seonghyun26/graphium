# @package _global_
# PairMixer medium configuration (~10M parameters)
#
# D_s=256, D_z=128, depth=18 → ~9.8M params
# Reference: Ouyang-Zhang et al., arXiv:2510.18870
# Code: https://github.com/genesistherapeutics/pairmixer

architecture:
  pre_nn:
    out_dim: 256
    hidden_dims: 256

  gnn:
    in_dim: 256
    out_dim: 256
    hidden_dims: 256
    depth: 18
    residual_type: none           # PairMixer doesn't update node features (s_backbone=s_init);
                                  # simple residual would double them every layer → bf16 overflow.
    layer_type: 'pyg:pairmixer'
    layer_kwargs:
      pair_dim: 128              # Matches paper default C_z
      pair_dropout: 0.25
      hidden_dim_scaling: 4.0
      opm_hidden: 32
      # ---- Speed ----
      # compile=pair_track + ckpt=F → 2.6x fwd+bwd at depth=18, B=128
      # (bit-exact forward output; grad diff within bf16 eps).
      # Peak mem drops from ~68 GB to ~52 GB, so this fits easily on 96 GB
      # Blackwell GPUs. Set ckpt=true if running at a larger depth/B that
      # would otherwise OOM.
      use_checkpoint: false
      compile_mode: pair_track
      # ---- Pair representation initialization ----
      # z_0 = z_OPM + z_pair_prior (additive).  Guarantees a non-zero,
      # graph-aware pair representation at layer 0 so the triangle
      # multiplication backbone has a meaningful signal to refine.
      # See PairFeatureInitializer for details.
      pair_init:
        mode: additive
        use_opm: true
        opm_init: lecun
        use_pair_positional: true
        pair_positional:
          sources: [graph_distance, adjacency]
          graph_distance:
            max_dist: 8
            embedding_dim: 32
          adjacency:
            embedding_dim: 8

  graph_output_nn:
    graph:
      pair_dim: 128              # Pool pair_feat directly
      pair_pool: stats           # graph-aware stats pooling (level_in_dim = 6*pair_dim)
      hidden_dims: 256
      out_dim: 512
