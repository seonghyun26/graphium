# @package _global_
# PairMixer 20M + structural pair initialization (ablation arm).
#
# Adds graph-structural priors to the OPM-only pair representation:
#   z_0 = z_OPM + PE(graph_distance) + PE(adjacency)
#
# No edge chemistry here — this arm isolates the effect of pure
# graph-structural information (hop distance + 1-hop bond existence).
# Compare against baseline (pairmixer_20M) to measure the value of
# structural priors alone.
#
# See graphium/nn/pyg_layers/pair_init.py for the module details.

defaults:
  - pairmixer_20M

architecture:
  gnn:
    layer_kwargs:
      # Inherits pair_dim, pair_dropout, opm_hidden, use_checkpoint
      # from pairmixer_20M via Hydra deep merge.
      pair_init:
        mode: additive
        use_opm: true
        opm_init: lecun
        use_pair_positional: true
        pair_positional:
          sources: [graph_distance, adjacency]
          graph_distance:
            max_dist: 8
            embedding_dim: 32
          adjacency:
            embedding_dim: 8
