# @package _global_
# PairMixer Small with Mixture-of-Experts on the pair-track transition.
#
# Same backbone as pairmixer_small (D_s=192, D_z=64, depth=8) but the
# per-layer transition_z FFN is wrapped in a 4-expert top-2 MoE.

defaults:
  - pairmixer_small

architecture:
  gnn:
    layer_kwargs:
      moe_num_experts: 4
      moe_top_k: 2
      moe_aux_loss_coeff: 0.01
