# @package _global_
# PairMixer model configuration
# Based on: Gao et al., "Triangle Multiplication Is All You Need", arXiv:2510.18870
#
# Like Pairformer, PairMixer maintains two representation tracks:
#   - A single (node/sequence) track  s  of shape (B, N, D_s)
#   - A pairwise track  z  of shape (B, N, N, D_z)
#
# Unlike Pairformer, PairMixer removes triangle attention and pair-biased
# attention, using only triangle multiplication + transition MLPs.

architecture:
  gnn:
    depth: 16
    layer_type: 'pyg:pairmixer'
    layer_kwargs:
      pair_dim: 64               # Pairwise representation dimension (D_z)
      pair_dropout: 0.25         # Row/column-wise dropout on the pair track
      hidden_dim_scaling: 4.0    # Multiplier for transition MLP hidden dim
      opm_hidden: 32             # Hidden dim of the outer-product-mean layer
      use_checkpoint: true       # Gradient checkpointing for pair-track ops
