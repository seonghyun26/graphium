# @package _global_

# Pairformer with the RxRx3 cell morphology dataset.
constants:
  name: rxrx3_pairformer
  seed: 42
  max_epochs: 100
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/rxrx3/

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/rxrx3/pairformer/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed  # Pairformer triangle ops overflow fp16; bf16 has float32-range exponents
