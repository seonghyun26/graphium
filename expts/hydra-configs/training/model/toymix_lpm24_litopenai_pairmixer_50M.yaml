# @package _global_

# PairMixer ~50M with the ToyMix + L+M-24 OpenAI-caption dataset (1536-d head).
# 1536-d lpm24 task head is 2x wider than the PubMedBERT (768-d) variant, so
# bs is lower than the straight 40M-lpm24 anchor. 40M lpm24 bs=12 / 1.27 (D_z)
# / ~2 (head) ≈ 4-6. Starting at bs=6; watch for OOM on first epoch.
# DDP launch (2 GPUs) doubles the effective batch again.
constants:
  name: toymix_lpm24_litopenai_pairmixer_50M
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/toymix-lpm24-litopenai/

datamodule:
  args:
    batch_size_training: 6
    batch_size_inference: 6
    dataloading_from: ram
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-lpm24-litopenai/pairmixer_50M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 10
    save_top_k: -1
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 4   # single-GPU eff batch = 24; under DDP (devices=2) eff = 48
