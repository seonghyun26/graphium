# @package _global_

# PairMixer 20M with DTI pActivity pre-training.
# Task: MLP(GNN(molecule) || prot_emb_1152) -> pY
# Out head is only 1-dim (vs 1152 for old DTI), so batch can be larger.
constants:
  name: dti_pactivity_pairmixer_20M
  seed: 42
  max_epochs: 100
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/dti-pactivity/

datamodule:
  args:
    batch_size_training: 8       # halved after OOM; 1152-dim prot_emb aux input per sample
    batch_size_inference: 8
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/dti-pactivity/pairmixer_20M/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 8   # effective batch = 64 (doubled to compensate halved bs)
