# @package _global_

# PairMixer 12M (search-validated) with the ToyMix + DTI (ESM-C v2) dataset.
constants:
  name: toymix_dti_esmc_v2_pairmixer_12M
  seed: 42
  max_epochs: 100
  data_dir: /home/shpark/prj-molrepr/graphium/data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/toymix-dti-esmc-v2/

datamodule:
  args:
    batch_size_training: 96
    batch_size_inference: 96
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-dti-esmc-v2/pairmixer_12M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 20           # aligns with check_val_every_n_epoch=20 (linear-probe cadence)
    save_top_k: -1               # keep every 20-epoch snapshot for post-hoc probing
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 1   # effective batch = 96
