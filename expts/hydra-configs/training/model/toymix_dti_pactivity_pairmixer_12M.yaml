# @package _global_

# PairMixer 12M (search-validated) with ToyMix + DTI pActivity (protein-label pre-training).
# Uses ESM-C v2 (600M, 1152-dim) protein embeddings: MLP(GNN(mol) || prot_emb) -> pY.
constants:
  name: toymix_dti_pactivity_pairmixer_12M
  seed: 42
  max_epochs: 100
  data_dir: /home/shpark/prj-molrepr/graphium/data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/toymix-dti-pactivity/

datamodule:
  args:
    batch_size_training: 8       # OOM-safe: 1152-dim prot_emb aux input drives memory, matches 20M recipe
    batch_size_inference: 8
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-dti-pactivity/pairmixer_12M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 20           # aligns with check_val_every_n_epoch=20 (linear-probe cadence)
    save_top_k: -1               # keep every 20-epoch snapshot for post-hoc probing
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 8   # effective batch = 64 (doubled to compensate halved bs)
