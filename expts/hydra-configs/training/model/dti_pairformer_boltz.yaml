# @package _global_

# Boltz-inspired Pairformer with the DTI dataset.
constants:
  name: dti_pairformer_boltz
  seed: 42
  max_epochs: 100
  raise_train_error: true
  datacache_path: ../datacache/dti/

datamodule:
  args:
    batch_size_training: 4
    batch_size_inference: 4
    dataloading_from: ram
    num_workers: 0
    persistent_workers: false
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/dti/pairformer_boltz/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed  # Pairformer triangle ops overflow fp16; bf16 has float32-range exponents
    accumulate_grad_batches: 2  # effective batch size = 8
