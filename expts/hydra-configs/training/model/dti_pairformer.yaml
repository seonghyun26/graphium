# @package _global_

constants:
  name: dti_pairformer
  seed: 42
  max_epochs: 100
  raise_train_error: true
  datacache_path: ../datacache/dti/

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/dti/pairformer/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed  # Pairformer triangle ops overflow fp16; bf16 has float32-range exponents
