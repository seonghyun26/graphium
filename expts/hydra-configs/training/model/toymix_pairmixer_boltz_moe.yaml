# @package _global_

# Boltz-inspired PairMixer + MoE on the pair-track transition, ToyMix dataset.
constants:
  name: toymix_pairmixer_boltz_moe
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/neurips2023-small/

datamodule:
  args:
    batch_size_training: 16
    batch_size_inference: 16
    num_workers: 0           # avoid CoW memory duplication with ram loading
    persistent_workers: false
    featurization_n_jobs: 0  # avoid loky pickling issues with large models

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/small-dataset/pairmixer_boltz_moe/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed  # PairMixer triangle ops overflow fp16; bf16 has float32-range exponents
