# @package _global_

# PairMixer 12M (search-validated) with ToyMix + LPM-24 (Galactica-125m captions).
# Same optimiser/cadence as the pubmedbert variant; only run name and datacache
# path are split so the two embeddings don't share checkpoints or featurized cache.
constants:
  name: toymix_lpm24_galactica_pairmixer_12M
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/toymix-lpm24-galactica/

datamodule:
  args:
    batch_size_training: 96
    batch_size_inference: 96
    dataloading_from: ram
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-lpm24-galactica/pairmixer_12M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 20           # aligns with check_val_every_n_epoch=20 (linear-probe cadence)
    save_top_k: -1               # keep every 20-epoch snapshot for post-hoc probing
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 1   # effective batch = 96
