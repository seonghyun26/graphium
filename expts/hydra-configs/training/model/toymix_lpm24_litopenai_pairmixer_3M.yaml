# @package _global_

# PairMixer 3M with the ToyMix + L+M-24 OpenAI-caption dataset (1536-d head).
# 1536-d head is 2x wider than the PubMedBERT (768-d) variant. 3M pair tensor
# is ~4x lighter than 12M, so bs is bumped 2x vs the 12M anchor (bs=24).
constants:
  name: toymix_lpm24_litopenai_pairmixer_3M
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/toymix-lpm24-litopenai/

datamodule:
  args:
    batch_size_training: 48       # 12M anchor bs=24; 2x bump for lighter pair tensor
    batch_size_inference: 48
    dataloading_from: ram
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-lpm24-litopenai/pairmixer_3M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 20
    save_top_k: -1
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 1   # effective batch = 48
