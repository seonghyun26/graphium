# @package _global_
# Mid-layer REPA variant of the 3-aux PairMixer 12M pretrain.
#
# Architecture split (REPA paper §5.2 — intermediate-layer alignment):
#   * ToyMix supervised tasks (qm9, tox21, zinc) train at the END (final-layer
#     task heads, MAE/BCE losses — unchanged from baseline).
#   * Dense modality embeddings (DTI ESM-C, LPM-24 OpenAI, BBBC047 Cell
#     Painting) align at a MIDDLE layer (4 of 8) via REPA cosine through a
#     small per-task projector consuming the mean-pooled mid-layer pair tensor.
#
# Why mid-layer:
#   The trunk's deep layers (5-8) are no longer hostage to the 3 aux objectives,
#   so they're free to specialize for the supervised toymix loss. The prefix
#   (layers 1-4) carries modality-aligned features that act as regularization.
#   Yu et al. show this beats final-layer alignment by a wide margin on DiT.
#
# What changes vs. the MAE baseline (12M):
#   1. Three dense aux losses moved out of `predictor.loss_fun` (no longer go
#      through standard task heads).
#   2. Final-layer task heads for dti/lpm24/bbbc047 still exist in architecture
#      but are unused (no gradient — DDP needs find_unused_parameters_true).
#   3. New `predictor.repa_intermediate_kwargs` block configures the alignment.
#
# Compose with:
#   tasks=toymix_dti_esmc_v2_lpm24_litopenai_bbbc047
#   training=toymix_dti_esmc_v2_lpm24_litopenai_bbbc047
#   architecture=toymix
#   model=pairmixer_12M
#   training/model=toymix_dti_esmc_v2_lpm24_litopenai_bbbc047_pairmixer_12M_repa_mid

defaults:
  - toymix_dti_esmc_v2_lpm24_litopenai_bbbc047_pairmixer_12M

constants:
  name: toymix_dti_esmc_v2_lpm24_litopenai_bbbc047_pairmixer_12M_repa_mid

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/toymix_dti_esmc_v2_lpm24_litopenai_bbbc047/pairmixer_12M_repa_mid/${now:%Y-%m-%d_%H-%M-%S}/

predictor:
  # Neutralize the 3 dense aux losses at the FINAL layer — Hydra dict-merge
  # would otherwise keep the parent (tasks YAML) MAE entries, double-pulling
  # the trunk against the same targets via two paths. zero_loss_ipu returns
  # scalar 0 so the task heads exist (datamodule still produces preds for
  # them) but contribute no gradient. Real learning signal comes from the
  # mid-layer REPA alignment below.
  loss_fun:
    dti:     zero_loss_ipu
    lpm24:   zero_loss_ipu
    bbbc047: zero_loss_ipu
    qm9:   mae_ipu
    tox21: bce_logits_ipu
    zinc:  mae_ipu

  # Mid-layer REPA alignment.
  #   capture_layer = 4  →  middle of 8-layer PairMixer (0-indexed; counts from 0)
  #   d_pair        = 224  →  PairMixer 12M D_z (matches gnn.layer_kwargs.pair_dim)
  #   per task: hidden = max(d_pair, d_target) by default; weight = REPA's λ
  #
  # label_key = "graph_<task>" — full key used in batch.labels by Graphium's
  # datamodule for graph-level tasks (matches predictor._get_task_key output).
  repa_intermediate_kwargs:
    capture_layer: 4
    d_pair: 224
    tasks:
      dti:
        d_target: 1152      # ESM-C v2 protein embedding dim
        hidden: 512         # projector hidden ≈ trunk-pool dim (gives reasonable capacity)
        weight: 0.5         # REPA paper default
        label_key: graph_dti
      lpm24:
        d_target: 1536      # OpenAI text-embedding-3-small dim
        hidden: 512
        weight: 0.5
        label_key: graph_lpm24
      bbbc047:
        d_target: 672       # U2OS Cell Painting embedding dim
        hidden: 512
        weight: 0.5
        label_key: graph_bbbc047
