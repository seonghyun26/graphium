# @package _global_

# PairMixer F3hlr (best ≤12M config) with the ToyMix dataset.
constants:
  name: toymix_pairmixer_auto
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/neurips2023-small-feat2/

datamodule:
  args:
    batch_size_training: 32
    batch_size_inference: 32
    num_workers: 0
    persistent_workers: false
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/small-dataset/pairmixer_auto/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed
