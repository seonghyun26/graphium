# @package _global_

# GPS++ 800M (~800M params) with the ToyMix + LPM-24 dataset.
constants:
  name: toymix_lpm24_gpspp_800M
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/toymix-lpm24/

datamodule:
  args:
    batch_size_training: 64
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-lpm24/gpspp_800M/${now:%Y-%m-%d_%H-%M-%S}/
