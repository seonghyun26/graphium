# @package _global_
# MPNN++ 12M for the DTI downstream-eval flow.
# Mirrors dti_eval_pairmixer_12M.yaml — identical data-loader / trainer knobs,
# only name and checkpoint dir differ.

constants:
  name: dti_eval_${constants.dti_subset}_${constants.dti_split_method}_seed${constants.seed}_mpnnpp_12M
  seed: 42
  max_epochs: 100
  raise_train_error: false
  datacache_path: /home/shpark/prj-molrepr/datacache/dti-eval/${constants.dti_subset}/

datamodule:
  args:
    batch_size_training: 16
    batch_size_inference: 32
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/dti-eval/${constants.dti_subset}/${constants.dti_split_method}/seed${constants.seed}/mpnnpp_12M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 4
