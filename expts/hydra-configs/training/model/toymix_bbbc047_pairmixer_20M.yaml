# @package _global_

# PairMixer medium-large (~20M params) with the ToyMix + BBBC047 dataset.
constants:
  name: toymix_bbbc047_pairmixer_20M
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/toymix_bbbc047/

datamodule:
  args:
    batch_size_training: 12      # 2x 40M (bs=6); halved after OOM on bbbc047 head
    batch_size_inference: 12
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/toymix_bbbc047/pairmixer_20M/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed        # PairMixer triangle ops overflow fp16; bf16 has float32-range exponents
    accumulate_grad_batches: 4   # effective batch = 48 (per-step bs quartered vs. original 56)
