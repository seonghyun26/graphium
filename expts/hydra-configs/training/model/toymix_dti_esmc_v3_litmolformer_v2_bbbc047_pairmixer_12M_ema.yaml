# @package _global_
# 4ds v2 PairMixer 12M, plain multi-task pretrain (NO REPA), with:
#   * Final-layer task heads for ToyMix + DTI v3 + MolFormer-v2 + BBBC047
#     (standard MAE / BCE losses; no mid-layer alignment, no Boltz REPA).
#   * EMA (decay 0.999) for eval / final checkpoint.
#   * AdamW (wd=0.01) + gradient clip 1.0 (norm) inherited from the base.
#
# Compose with:
#   tasks=toymix_dti_esmc_v3_litmolformer_v2_bbbc047
#   training=toymix_dti_esmc_v3_litmolformer_v2_bbbc047
#   architecture=toymix
#   model=pairmixer_12M
#   training/model=toymix_dti_esmc_v3_litmolformer_v2_bbbc047_pairmixer_12M_ema

defaults:
  - toymix_dti_esmc_v3_litmolformer_v2_bbbc047_pairmixer_12M

constants:
  name: toymix_dti_esmc_v3_litmolformer_v2_bbbc047_pairmixer_12M_ema

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/toymix_dti_esmc_v3_litmolformer_v2_bbbc047/pairmixer_12M_ema/${now:%Y-%m-%d_%H-%M-%S}/
  ema:
    enabled: true
    decay: 0.999
    use_for_validation: true
    use_for_test: true
    save_ema_checkpoint: true
