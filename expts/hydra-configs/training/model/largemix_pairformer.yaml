# @package _global_

# Pairformer model with the Largemix dataset.
constants:
  name: largemix_pairformer_4layer
  seed: 42
  max_epochs: 100
  data_dir: ../data/neurips2023/large-dataset
  raise_train_error: true
  datacache_path: ../datacache/neurips2023-large/

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/large-dataset/pairformer/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed  # Pairformer triangle ops overflow fp16; bf16 has float32-range exponents
