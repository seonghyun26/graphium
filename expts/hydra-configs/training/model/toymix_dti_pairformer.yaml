# @package _global_

constants:
  name: toymix_dti_pairformer
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: ../datacache/toymix-dti/

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/toymix-dti/pairformer/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed  # Pairformer triangle ops overflow fp16; bf16 has float32-range exponents
