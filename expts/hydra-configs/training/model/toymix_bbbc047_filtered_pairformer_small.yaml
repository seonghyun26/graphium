# @package _global_

# Pairformer Small with the ToyMix + BBBC047 filtered dataset.
constants:
  name: toymix_bbbc047_filtered_pairformer_small
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/toymix_bbbc047_filtered/

datamodule:
  args:
    batch_size_training: 2
    batch_size_inference: 2
    dataloading_from: ram
    num_workers: 0
    persistent_workers: false
    featurization_n_jobs: 0

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/toymix_bbbc047_filtered/pairformer_small/${now:%Y-%m-%d_%H-%M-%S}/
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 4  # effective batch size = 8
