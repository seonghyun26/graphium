# @package _global_

# PairMixer 12M (search-validated) with the LargeMix dataset.
constants:
  name: largemix_pairmixer_12M
  seed: 42
  max_epochs: 100
  data_dir: ../data/neurips2023/large-dataset
  raise_train_error: true
  datacache_path: ../datacache/neurips2023-large/

datamodule:
  args:
    batch_size_training: 16      # halved from 32; largemix heads (PCBA_1328 + L1000 + PCQM4M) OOM at 32
    batch_size_inference: 16
    num_workers: 8               # bumped from 4 — DataLoader was starving the GPU between steps
    persistent_workers: true
    featurization_n_jobs: 8
    task_specific_args:
      # 4× per-task speedup; each task gets full coverage over ~5 epochs.
      pcba_1328:
        epoch_sampling_fraction: 0.25
      pcqm4m_g25:
        epoch_sampling_fraction: 0.25
      pcqm4m_n4:
        epoch_sampling_fraction: 0.25

trainer:
  model_checkpoint:
    dirpath: models_checkpoints/large-dataset/pairmixer_12M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 10           # aligns with check_val_every_n_epoch=10 (linear-probe cadence)
    save_top_k: -1               # keep every 20-epoch snapshot for post-hoc probing
  trainer:
    precision: bf16-mixed        # PairMixer triangle ops overflow fp16
    accumulate_grad_batches: 2   # effective batch = 32 (matches original target)
