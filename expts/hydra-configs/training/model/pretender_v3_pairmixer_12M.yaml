# @package _global_
# PairMixer 12M base config for pretender_v3 (downstream-leakage-filtered 4ds).
# Same per-step batch / accum settings as the unfiltered v3 4ds; only the
# datacache and checkpoint dir differ (filtered SMILES → fresh featurization).

constants:
  name: pretender_v3_pairmixer_12M
  seed: 42
  max_epochs: 100
  data_dir: ./data/graphium/neurips2023/small-dataset
  raise_train_error: true
  datacache_path: /home/shpark/prj-molrepr/datacache/pretender_v3/

datamodule:
  args:
    batch_size_training: 8
    batch_size_inference: 8
    num_workers: 4
    persistent_workers: true
    featurization_n_jobs: 8

trainer:
  model_checkpoint:
    dirpath: /home/shpark/prj-molrepr/graphium/models_checkpoints/pretender_v3/pairmixer_12M/${now:%Y-%m-%d_%H-%M-%S}/
    filename: "${constants.name}_epoch{epoch:03d}"
    every_n_epochs: 10
    save_top_k: -1
  trainer:
    precision: bf16-mixed
    accumulate_grad_batches: 6
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
  ema:
    enabled: true
    decay: 0.999
    use_for_validation: true
    use_for_test: true
    save_ema_checkpoint: true

predictor:
  optim_kwargs:
    lr: 1.e-4
    weight_decay: 0.01
    optim_impl: AdamW
