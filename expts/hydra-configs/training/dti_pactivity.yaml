# @package _global_
#
# Training config for the DTI pActivity pre-training task.
# Matches the structure of training/dti_esmc.yaml (lr, scheduler, checkpoint paths).

predictor:
  random_seed: ${constants.seed}
  optim_kwargs:
    lr: 1.e-4
  torch_scheduler_kwargs:
    module_type: WarmUpLinearLR
    max_num_epochs: &max_epochs 100
    warmup_epochs: 5
    verbose: False
  scheduler_kwargs:
  target_nan_mask: null
  multitask_handling: flatten

trainer:
  seed: ${constants.seed}
  logger:
    save_dir: logs/dti_pactivity/
    name: ${constants.name}
    project: ${constants.name}
  model_checkpoint:
    dirpath: model_checkpoints/dti_pactivity/${now:%Y-%m-%d_%H-%M-%S}/
    filename: ${constants.name}
    save_last: True
  trainer:
    precision: 16-mixed
    max_epochs: ${predictor.torch_scheduler_kwargs.max_num_epochs}
    min_epochs: 1
    check_val_every_n_epoch: 5
