datamodule:
  module_type: ADMETBenchmarkDataModule
  args:
    prepare_dict_or_graph: pyg:graph
    featurization_n_jobs: 0
    featurization_progress: true
    featurization_backend: loky
    processed_graph_data_path: ${constants.datacache_path}
    dataloading_from: ram
    num_workers: 0
    persistent_workers: false
    featurization:
      atom_property_list_onehot:
      - atomic-number
      - group
      - period
      - total-valence
      atom_property_list_float:
      - degree
      - formal-charge
      - radical-electron
      - aromatic
      - in-ring
      edge_property_list:
      - bond-type-onehot
      - stereo
      - in-ring
      add_self_loop: false
      explicit_H: false
      use_bonds_weights: false
      pos_encoding_as_features:
        pos_types:
          lap_eigvec:
            pos_level: node
            pos_type: laplacian_eigvec
            num_pos: 8
            normalization: none
            disconnected_comp: true
          lap_eigval:
            pos_level: node
            pos_type: laplacian_eigval
            num_pos: 8
            normalization: none
            disconnected_comp: true
          rw_pos:
            pos_level: node
            pos_type: rw_return_probs
            ksteps: 16
      conformer_property_list: []
    tdc_benchmark_names: hia_hou
    tdc_train_val_seed: ${constants.seed}
    batch_size_training: 192
    batch_size_inference: 200
