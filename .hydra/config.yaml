accelerator:
  type: gpu
  float32_matmul_precision: medium
architecture:
  model_type: FullGraphMultiTaskNetwork
  mup_base_path: null
  pre_nn:
    out_dim: 1536
    hidden_dims: 1536
    depth: 2
    activation: relu
    last_activation: none
    dropout: 0.18
    normalization: layer_norm
    last_normalization: ${architecture.pre_nn.normalization}
    residual_type: none
  pre_nn_edges: null
  pe_encoders:
    out_dim: 32
    pool: sum
    last_norm: None
    encoders:
      la_pos:
        encoder_type: laplacian_pe
        input_keys:
        - laplacian_eigvec
        - laplacian_eigval
        output_keys:
        - feat
        hidden_dim: 64
        out_dim: 32
        model_type: DeepSet
        num_layers: 2
        num_layers_post: 1
        dropout: 0.1
        first_normalization: none
      rw_pos:
        encoder_type: mlp
        input_keys:
        - rw_return_probs
        output_keys:
        - feat
        hidden_dim: 64
        out_dim: 32
        num_layers: 2
        dropout: 0.1
        normalization: layer_norm
        first_normalization: layer_norm
  gnn:
    in_dim: 1536
    out_dim: 1536
    hidden_dims: 1536
    depth: 12
    activation: gelu
    last_activation: none
    dropout: 0.1
    normalization: layer_norm
    last_normalization: ${architecture.pre_nn.normalization}
    residual_type: simple
    virtual_node: none
    layer_type: pyg:gps
    layer_kwargs:
      node_residual: false
      mpnn_type: pyg:mpnnplus
      mpnn_kwargs:
        in_dim: 1536
        out_dim: 1536
        in_dim_edges: 13
        out_dim_edges: 13
      attn_type: full-attention
      precision: 16-true
      attn_kwargs:
        num_heads: 32
      droppath_rate_attn: 0.0
      droppath_rate_ffn: 0.0
  graph_output_nn:
    graph:
      pooling:
      - sum
      out_dim: 96
      hidden_dims: 1536
      depth: 1
      activation: relu
      last_activation: none
      dropout: ${architecture.pre_nn.dropout}
      normalization: ${architecture.pre_nn.normalization}
      last_normalization: none
      residual_type: none
  task_heads:
    caco2_wang:
      task_level: graph
      out_dim: 1
      hidden_dims: 64
      depth: 2
      activation: relu
      last_activation: none
      dropout: 0.5
      normalization: layer_norm
      last_normalization: none
      residual_type: none
    hia_hou:
      task_level: graph
      out_dim: 1
      hidden_dims: 256
      depth: 4
      activation: relu
      last_activation: sigmoid
      dropout: 0.5
      normalization: layer_norm
      last_normalization: none
      residual_type: none
    pgp_broccatelli:
