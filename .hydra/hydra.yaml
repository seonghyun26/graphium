hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=gpspp_800M
    - accelerator=gpu
    - tasks=admet
    - ++constants.seed=0
    - ++constants.wandb.entity=eddy26
    - ++constants.wandb.save_dir=null
    - ++constants.wandb.project=graphium
    - ++constants.wandb.tags=['gpspp','scratch','admet']
    - ++constants.results_csv_dir=/home/shpark/prj-molrepr/graphium/results
    - ++constants.raise_train_error=False
    - ++constants.task=hia_hou
    - ++datamodule.args.tdc_benchmark_names=hia_hou
    - ++datamodule.args.num_workers=0
    - ++datamodule.args.featurization_n_jobs=0
    - ++architecture.task_heads.hia_hou.hidden_dims=256
    - ++architecture.task_heads.hia_hou.depth=4
    - ++trainer.model_checkpoint.save_last=False
  job:
    name: train_finetune_test
    chdir: null
    override_dirname: ++architecture.task_heads.hia_hou.depth=4,++architecture.task_heads.hia_hou.hidden_dims=256,++constants.raise_train_error=False,++constants.results_csv_dir=/home/shpark/prj-molrepr/graphium/results,++constants.seed=0,++constants.task=hia_hou,++constants.wandb.entity=eddy26,++constants.wandb.project=graphium,++constants.wandb.save_dir=null,++constants.wandb.tags=['gpspp','scratch','admet'],++datamodule.args.featurization_n_jobs=0,++datamodule.args.num_workers=0,++datamodule.args.tdc_benchmark_names=hia_hou,++trainer.model_checkpoint.save_last=False,accelerator=gpu,model=gpspp_800M,tasks=admet
    id: ???
    num: ???
    config_name: main
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/shpark/prj-molrepr/graphium
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: expts.hydra-configs
      schema: pkg
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/shpark/prj-molrepr/graphium
    choices:
      model: gpspp_800M
      training: toymix
      tasks: admet
      tasks/loss_metrics_datamodule: admet
      tasks/task_heads: admet
      architecture: toymix
      accelerator: gpu
      training/model: toymix_gpspp_800M
      training/accelerator: toymix_gpu
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
